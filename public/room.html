<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <script src="room.js" defer></script>
</head>

<body>
    <div id="endGameOverlay" class="hidden">
        <h1 id="endGameMessage"> </h1>
        <p>Rematch om 5 sekunder</p>
    </div>
    <script src="/socket.io/socket.io.js"></script>
    <script>
        let playerID = localStorage.getItem("playerId")

        const socket = io({
            query: {
                playerId: playerID
            }
        })
        const lobbyId = window.location.search.slice(1)

        socket.emit('joinLobby', lobbyId);

        // När en lobby är redo med 2 spelare inne
        socket.on('lobbyReady', players => {
            document.getElementById('status').innerText = `Lobby redo! Spelare: ${players.join(',')}`;
        })

        socket.on('dealHand', hand => {
            hand.forEach(card => {
                drawCardToHand(card.rank, card.suit);
            });
        })

        socket.on('opponentPlayedCard', cardData => {
            playCard("opponentBoard", cardData)
        })

        // Felhantering exempelvis full lobby eller fel ID
        socket.on('errorMessage', msg => {
            document.getElementById('status').innerText = `Fel ${msg}`;
        })

        socket.on('Victory', () => showEndGame("Victory"));
        socket.on('Defeat', () => showEndGame("Defeat"));
        socket.on("Draw", () => showEndGame("Draw"));

        socket.on('Rematch', () => {
            hideEndGame();
            resetBoard();
            document.getElementById('status').innerText = "Ny runda har startat"
        })

    </script>


    <section class="game-table">
        <header class="table-header">
            <section id="lobbyId" class="lobby-id"></section>
            <section id="status" class="status">Väntar på motspelare...</section>
            <button class="status" onclick="goBackToMenu()">Tillbaka till Meny</button>
        </header>

        <section id="opponentHand" class="player-zone opponent-zone">
            <h2 class="zone-title">
                Motståndare <span id="opponentScore" class="score-counter">Poäng 0</span>
            </h2>
        </section>

        <section id="opponentBoard" class="board-zone">
            <div class="card-slot"></div>
            <div class="card-slot"></div>
            <div class="card-slot"></div>
            <div class="card-slot"></div>
            <div class="card-slot"></div>

        </section>

        <section id="yourBoard" class="board-zone">
            <div class="card-slot"></div>
            <div class="card-slot"></div>
            <div class="card-slot"></div>
            <div class="card-slot"></div>
            <div class="card-slot"></div>
        </section>

        <section id="yourHand" class="player-zone your-zone">
            <h2 class="zone-title">
                Din hand <span id="yourScore" class="score-counter">Poäng 0</span>
            </h2>
        </section>

</body>
